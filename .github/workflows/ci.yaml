name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=rust-lang/rust
      RUST_VERSION: 1.98.1
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format, lint, test, audit
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          export RUSTUP_TOOLCHAIN="${RUST_VERSION}"
          cargo install --locked --root "${RUNNER_TEMP}/cargo-audit" cargo-audit --version "${CARGO_AUDIT_VERSION}"
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          "${RUNNER_TEMP}/cargo-audit/bin/cargo-audit" audit
      - name: Build image
        run: docker build .

  publish:
    name: Build and publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build \
            -t ghcr.io/mich-murphy/media-broker:main \
            -t "ghcr.io/mich-murphy/media-broker:sha-${GITHUB_SHA::12}" \
            .
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u mich-murphy --password-stdin
      - name: Publish
        run: |
          docker push ghcr.io/mich-murphy/media-broker:main
          docker push "ghcr.io/mich-murphy/media-broker:sha-${GITHUB_SHA::12}"
