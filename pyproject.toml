[project]
name = "media-broker"
version = "0.1.0"
description = "Read-only MCP broker for local media services"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.28.1",
    "pydantic==2.13.5",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[project.scripts]
media-broker = "media_broker.server:main"

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.13.2",
]

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C90", "S", "ANN", "ARG", "ASYNC",
    "PERF", "PIE", "PL", "PT", "RUF", "T20",
]
# Upstream JSON is genuinely Any; numeric bounds read better inline than as constants.
ignore = ["ANN401", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
# Asserts, fixed fake credentials, and 0.0.0.0 are the subject of the tests.
"tests/*" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
