[package]
name = "media-broker"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Controlled MCP broker for local media services"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
hmac = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.2", features = ["jiff02"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
url = "2"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
